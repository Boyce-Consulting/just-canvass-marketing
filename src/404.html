<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Just Canvass</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Open Sans', 'Segoe UI', sans-serif;
            background-color: #faf6f3;
            color: #2b2d42;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .leaf { font-size: 3rem; display: block; margin-bottom: 1rem; }
        p { font-size: 1.1rem; margin-bottom: 2rem; color: #555a73; }
        a.btn {
            display: inline-block;
            background-color: #ff6b35;
            color: white;
            font-weight: 600;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
        }
        a.btn:hover { background-color: #f4530f; }
    </style>
</head>
<body>
    <main>
        <span class="leaf">🍁</span>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has moved.</p>
        <a class="btn" href="/">Back to Just Canvass</a>
    </main>
</body>
</html>
